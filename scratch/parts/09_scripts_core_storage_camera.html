  <script>
    // ==========================================
    // DOCERENA CORE STATE & COMPATIBILITY LAYER
    // ==========================================
    let currentScreen = 'home';
    let cameraMode = 'single';
    let currentFilter = 'magic';
    let currentBrightness = 0;
    let currentRotation = 0;
    let viewerZoom = 1.0;
    let selectedOrganizerIndex = 0;
    var selectedDocIdForMenu = '1';
    var selectedDocIdForPermanentDelete = null;
    var trashedDocItems = [];
    var mergeSelectedFiles = [];
    var documents = [];
    var folders = [];
    var sessionPages = []; // Active scan batch session
    var currentFacingMode = 'environment';
    var isBatchMode = false;
    var isCameraInitializing = false;
    var activeDocForViewer = null;
    var viewerActivePageIndex = 0;
    var activeCameraStream = null;
    var flashModes = ['Off', 'Auto', 'Torch'];
    var currentFlashIndex = 0;
    var selectedSplitDoc = {
      id: 'doc_prop',
      title: 'Project Proposal.pdf',
      pages: [{ id: 'p1' }, { id: 'p2' }, { id: 'p3' }, { id: 'p4' }, { id: 'p5' }, { id: 'p6' }],
      size: '4.8 MB'
    };
    var selectedCompressDoc = {
      id: 'doc_prop',
      title: 'Project Proposal.pdf',
      pages: [{ id: 'p1' }, { id: 'p2' }, { id: 'p3' }],
      size: '4.8 MB'
    };
    var currentFolderFilterId = null;

    // ==========================================
    // DURABLE STORAGE ENGINE (DocErenaStorage)
    // Survives app force-stops & process restart
    // ==========================================
    const DocErenaStorage = {
      DOCS_KEY: 'docerena_documents_v2',
      FOLDERS_KEY: 'docerena_folders_v2',
      TRASH_KEY: 'docerena_trash_v2',
      SETTINGS_KEY: 'docerena_settings_v2',
      ONBOARDING_KEY: 'docerena_onboarding_completed',

      init() {
        try {
          // Initialize folders if missing
          let storedFolders = localStorage.getItem(this.FOLDERS_KEY);
          if (!storedFolders && typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.getDurableData === 'function') {
            storedFolders = DocErenaBridge.getDurableData(this.FOLDERS_KEY);
          } else if (!storedFolders && typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.getDurableData === 'function') {
            storedFolders = DocErenaNative.getDurableData(this.FOLDERS_KEY);
          }
          if (!storedFolders) {
            folders = [
              { id: 'f_work', name: 'Work', color: 'purple', createdAt: Date.now() - 86400000 * 5 },
              { id: 'f_personal', name: 'Personal', color: 'yellow', createdAt: Date.now() - 86400000 * 3 }
            ];
            this.saveFolders(folders);
          } else {
            folders = JSON.parse(storedFolders);
          }

          // Initialize documents with dual-layer durable reconciliation
          let storedDocs = localStorage.getItem(this.DOCS_KEY);
          let nativeDocs = null;
          if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.getDurableData === 'function') {
            nativeDocs = DocErenaBridge.getDurableData(this.DOCS_KEY);
          } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.getDurableData === 'function') {
            nativeDocs = DocErenaNative.getDurableData(this.DOCS_KEY);
          }
          if ((!storedDocs || storedDocs === '[]') && (nativeDocs && nativeDocs !== '[]')) {
            storedDocs = nativeDocs;
            try { localStorage.setItem(this.DOCS_KEY, storedDocs); } catch (e) {}
          } else if (storedDocs && (!nativeDocs || nativeDocs === '[]')) {
            if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setDurableData === 'function') {
              DocErenaBridge.setDurableData(this.DOCS_KEY, storedDocs);
            }
          }
          if (!storedDocs) {
            documents = [];
            this.saveDocuments(documents);
          } else {
            try {
              documents = JSON.parse(storedDocs);
            } catch (err) {
              documents = [];
            }
          }

          // Initialize trash if missing (clean production empty state)
          let storedTrash = localStorage.getItem(this.TRASH_KEY);
          if (!storedTrash && typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.getDurableData === 'function') {
            storedTrash = DocErenaBridge.getDurableData(this.TRASH_KEY);
          } else if (!storedTrash && typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.getDurableData === 'function') {
            storedTrash = DocErenaNative.getDurableData(this.TRASH_KEY);
          }
          if (!storedTrash) {
            trashedDocItems = [];
            this.saveTrash(trashedDocItems);
          } else {
            trashedDocItems = JSON.parse(storedTrash);
          }
        } catch (e) {
          console.error("Storage init error:", e);
        }
      },

      saveDocuments(docs) {
        try {
          documents = docs;
          const jsonStr = JSON.stringify(docs);
          localStorage.setItem(this.DOCS_KEY, jsonStr);
          if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setDurableData === 'function') {
            DocErenaBridge.setDurableData(this.DOCS_KEY, jsonStr);
          } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.setDurableData === 'function') {
            DocErenaNative.setDurableData(this.DOCS_KEY, jsonStr);
          }
        } catch (e) {
          console.error("Failed to save documents:", e);
        }
      },

      saveFolders(flds) {
        try {
          folders = flds;
          const jsonStr = JSON.stringify(flds);
          localStorage.setItem(this.FOLDERS_KEY, jsonStr);
          if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setDurableData === 'function') {
            DocErenaBridge.setDurableData(this.FOLDERS_KEY, jsonStr);
          } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.setDurableData === 'function') {
            DocErenaNative.setDurableData(this.FOLDERS_KEY, jsonStr);
          }
        } catch (e) {
          console.error("Failed to save folders:", e);
        }
      },

      saveTrash(trash) {
        try {
          trashedDocItems = trash;
          const jsonStr = JSON.stringify(trash);
          localStorage.setItem(this.TRASH_KEY, jsonStr);
          if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setDurableData === 'function') {
            DocErenaBridge.setDurableData(this.TRASH_KEY, jsonStr);
          } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.setDurableData === 'function') {
            DocErenaNative.setDurableData(this.TRASH_KEY, jsonStr);
          }
        } catch (e) {
          console.error("Failed to save trash:", e);
        }
      },

      getDocuments() {
        return documents;
      },

      getDocument(id) {
        return documents.find(d => d.id === id);
      },

      saveDocument(doc) {
        const idx = documents.findIndex(d => d.id === doc.id);
        if (idx >= 0) {
          documents[idx] = doc;
        } else {
          documents.unshift(doc);
        }
        this.saveDocuments(documents);
      },

      getFolders() {
        return folders;
      },

      getTrash() {
        return trashedDocItems;
      },

      isOnboardingCompleted() {
        const localVal = localStorage.getItem(this.ONBOARDING_KEY) === 'true';
        let nativeVal = false;
        if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.isOnboardingCompleted === 'function') {
          nativeVal = DocErenaBridge.isOnboardingCompleted();
        } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.isOnboardingCompleted === 'function') {
          nativeVal = DocErenaNative.isOnboardingCompleted();
        }
        return localVal || nativeVal;
      },

      setOnboardingCompleted() {
        localStorage.setItem(this.ONBOARDING_KEY, 'true');
        if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setOnboardingCompleted === 'function') {
          DocErenaBridge.setOnboardingCompleted(true);
        } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.setOnboardingCompleted === 'function') {
          DocErenaNative.setOnboardingCompleted(true);
        }
      },

      resetOnboarding() {
        localStorage.setItem(this.ONBOARDING_KEY, 'false');
        if (typeof DocErenaBridge !== 'undefined' && typeof DocErenaBridge.setOnboardingCompleted === 'function') {
          DocErenaBridge.setOnboardingCompleted(false);
        } else if (typeof DocErenaNative !== 'undefined' && typeof DocErenaNative.setOnboardingCompleted === 'function') {
          DocErenaNative.setOnboardingCompleted(false);
        }
      },

      // Production pure mode: Never seed mock documents; user documents only
      seedInitialDocuments() {
        return [];
      }
    };
    window.DocErenaStorage = DocErenaStorage;
    window.sessionPages = sessionPages;
    window.documents = documents;
    window.folders = folders;

    // Helper: Draws realistic document with text, headers, and bar on canvas
    function generateSampleDocumentCanvas(title, subtitle, pageNum, totalPages) {
      const c = document.createElement('canvas');
      c.width = 800;
      c.height = 1100;
      const ctx = c.getContext('2d');

      // Crisp paper background with subtle scan texture
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 800, 1100);

      // Subtle off-white border
      ctx.strokeStyle = '#E2E8F0';
      ctx.lineWidth = 1;
      ctx.strokeRect(20, 20, 760, 1060);

      // Header Bar
      ctx.fillStyle = '#EDE9FE';
      ctx.fillRect(40, 40, 720, 70);
      ctx.fillStyle = '#7C3AED';
      ctx.fillRect(40, 40, 8, 70);

      // Header Text
      ctx.fillStyle = '#1E1B18';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText(title, 65, 80);

      ctx.fillStyle = '#64748B';
      ctx.font = 'normal 14px sans-serif';
      ctx.fillText(subtitle, 65, 100);

      // Page stamp
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#8B5CF6';
      ctx.fillText(`PAGE ${pageNum} OF ${totalPages}`, 660, 80);

      // Document Body Lines & Paragraphs
      ctx.fillStyle = '#1E1B18';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('1. Overview & Verification', 50, 160);

      ctx.fillStyle = '#475569';
      ctx.font = 'normal 13px sans-serif';
      const lines = [
        'This document scan was recorded and processed completely offline using DocErena.',
        'DocErena guarantees 100% offline privacy with zero external telemetry or cloud uploads.',
        'High-resolution canvas processing ensures sharp text and pristine contrast.',
        'Cryptographic ISO 32000-1 binary PDF generation preserves pixel-exact scans.'
      ];
      lines.forEach((l, idx) => {
        ctx.fillText(l, 50, 190 + idx * 24);
      });

      // Sample Data Table
      ctx.fillStyle = '#F8FAFC';
      ctx.fillRect(50, 310, 700, 180);
      ctx.strokeStyle = '#CBD5E1';
      ctx.strokeRect(50, 310, 700, 180);

      ctx.fillStyle = '#1E1B18';
      ctx.font = 'bold 13px sans-serif';
      ctx.fillText('ITEM DESCRIPTION', 70, 340);
      ctx.fillText('QTY', 450, 340);
      ctx.fillText('UNIT PRICE', 540, 340);
      ctx.fillText('TOTAL', 660, 340);

      ctx.beginPath();
      ctx.moveTo(50, 355);
      ctx.lineTo(750, 355);
      ctx.stroke();

      ctx.font = 'normal 12px sans-serif';
      ctx.fillStyle = '#334155';
      ctx.fillText('Mobile Scanner Implementation Package', 70, 385);
      ctx.fillText('1', 460, 385);
      ctx.fillText('$1,200.00', 540, 385);
      ctx.fillText('$1,200.00', 660, 385);

      ctx.fillText('Offline ISO 32000 PDF Compiler Core', 70, 420);
      ctx.fillText('1', 460, 420);
      ctx.fillText('$850.00', 540, 420);
      ctx.fillText('$850.00', 660, 420);

      ctx.fillText('26 Pastel Visual Design Rebuild Pack', 70, 455);
      ctx.fillText('1', 460, 455);
      ctx.fillText('$750.00', 540, 455);
      ctx.fillText('$750.00', 660, 455);

      // Barcode / Verification Stamp
      ctx.fillStyle = '#1E1B18';
      for (let i = 0; i < 40; i++) {
        const w = (i % 3 === 0) ? 4 : 2;
        ctx.fillRect(50 + i * 8, 920, w, 40);
      }
      ctx.font = '10px monospace';
      ctx.fillStyle = '#64748B';
      ctx.fillText('DOCERENA-OFFLINE-SHA256-VERIFIED', 50, 975);

      // Footer
      ctx.font = 'italic 11px sans-serif';
      ctx.fillStyle = '#94A3B8';
      ctx.fillText('DigitalErena Mobile PDF Studio · 100% Offline by Design', 50, 1040);

      return c.toDataURL('image/jpeg', 0.92);
    }

    function initSampleSessionPages() {
      if (sessionPages.length > 0) return;
      for (let i = 1; i <= 4; i++) {
        const dUrl = generateSampleDocumentCanvas('Scanned Document', `Page ${i} - High Resolution Scan`, i, 4);
        sessionPages.push({
          id: `sess_p_${i}`,
          title: `Page ${i}`,
          rawUrl: dUrl,
          croppedUrl: dUrl,
          enhancedUrl: dUrl,
          width: 800,
          height: 1100,
          rotation: 0,
          filter: 'magic',
          brightness: 0,
          pins: {
            tl: { x: 0.05, y: 0.05 },
            tr: { x: 0.95, y: 0.05 },
            br: { x: 0.95, y: 0.95 },
            bl: { x: 0.05, y: 0.95 }
          }
        });
      }
      selectedOrganizerIndex = 0;
      updateBatchThumbBadge();
    }

    // ==========================================
    // REAL CAMERA & IMPORT SCANNER SUBSYSTEM
    // ==========================================
    async function getMediaStreamWithFallback(facing) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("getUserMedia not supported in this environment");
      }

      const facingVal = facing || 'environment';
      const constraintSets = [
        // 1. High resolution with ideal facingMode
        {
          video: {
            facingMode: { ideal: facingVal },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        },
        // 2. Exact facingMode with standard HD constraints
        {
          video: {
            facingMode: facingVal,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        },
        // 3. Simple facingMode constraint
        {
          video: {
            facingMode: facingVal
          },
          audio: false
        },
        // 4. Basic unconstrained video (maximum OEM & emulator compatibility)
        {
          video: true,
          audio: false
        }
      ];

      let lastError = null;
      for (const constraints of constraintSets) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) {
            return stream;
          }
        } catch (err) {
          lastError = err;
          console.warn("Camera constraint attempt failed:", constraints, err);
          // If explicitly denied or security blocked, do not loop over remaining constraints
          if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError' || err.name === 'SecurityError') {
            throw err;
          }
        }
      }
      throw lastError || new Error("Unable to obtain camera stream with any constraint");
    }

    async function startScanning(mode) {
      cameraMode = mode || 'single';
      isBatchMode = (mode === 'batch');
      navigateTo('camera');
      await initCamera();
    }

    async function initCamera() {
      if (isCameraInitializing) return;
      isCameraInitializing = true;

      const videoEl = document.getElementById('camera-video');
      const inactiveView = document.getElementById('camera-inactive-view');
      const banner = document.getElementById('camera-error-banner');
      const loadingIndicator = document.getElementById('camera-loading-indicator');

      // Stop previous stream if running
      stopCamera();

      if (loadingIndicator) loadingIndicator.classList.remove('hidden');

      try {
        // Proactively request native Android permission if bridge is available
        if (window.DocErenaBridge && typeof window.DocErenaBridge.hasCameraPermission === 'function') {
          if (!window.DocErenaBridge.hasCameraPermission()) {
            if (typeof window.DocErenaBridge.requestCameraPermission === 'function') {
              window.DocErenaBridge.requestCameraPermission();
            }
          }
        }

        // Acquire media stream with robust fallback (NO artificial 2.5s timeout!)
        activeCameraStream = await getMediaStreamWithFallback(currentFacingMode);

        if (videoEl) {
          videoEl.srcObject = activeCameraStream;
          videoEl.classList.remove('hidden');
          try {
            await videoEl.play();
          } catch(e) {
            console.warn("Video element play() warning:", e);
          }
        }

        // Attach also to ID card and Book scan feeds if on those screens
        const idFeed = document.getElementById('id-card-camera-feed');
        if (idFeed) {
          idFeed.srcObject = activeCameraStream;
          idFeed.classList.remove('hidden');
          try { idFeed.play(); } catch(e) {}
        }
        const idInactive = document.getElementById('id-card-inactive-view');
        if (idInactive) idInactive.classList.add('hidden');

        const bookFeed = document.getElementById('book-camera-feed');
        if (bookFeed) {
          bookFeed.srcObject = activeCameraStream;
          bookFeed.classList.remove('hidden');
          try { bookFeed.play(); } catch(e) {}
        }
        const bookInactive = document.getElementById('book-inactive-view');
        if (bookInactive) bookInactive.classList.add('hidden');

        if (inactiveView) inactiveView.classList.add('hidden');
        if (banner) banner.classList.add('hidden');
        if (loadingIndicator) loadingIndicator.classList.add('hidden');

        updateBatchThumbBadge();
      } catch (err) {
        console.warn("Camera init failed:", err);
        if (loadingIndicator) loadingIndicator.classList.add('hidden');
        showCameraErrorBanner();
      } finally {
        isCameraInitializing = false;
      }
    }

    // Android Native Permission Callbacks invoked by MainActivity.java
    window.onCameraPermissionResult = function(granted) {
      console.log("window.onCameraPermissionResult:", granted);
      if (granted) {
        const banner = document.getElementById('camera-error-banner');
        if (banner) banner.classList.add('hidden');
        if (currentScreen === 'camera') {
          initCamera();
        } else if (currentScreen === 'scan-id-card') {
          if (typeof initIdCardScan === 'function') initIdCardScan();
          initCamera();
        } else if (currentScreen === 'scan-book') {
          if (typeof initBookScan === 'function') initBookScan();
          initCamera();
        }
      } else {
        showCameraErrorBanner();
        showToast('Camera permission denied. Tap Settings to grant access.');
      }
    };

    window.onCameraPermissionGranted = function() {
      window.onCameraPermissionResult(true);
    };

    // Native Camera Intent Bridge invoked by MainActivity.java
    function triggerNativeCamera() {
      if (window.DocErenaBridge && typeof window.DocErenaBridge.launchNativeCamera === 'function') {
        try {
          window.DocErenaBridge.launchNativeCamera();
          return;
        } catch (e) {
          console.warn("DocErenaBridge.launchNativeCamera error:", e);
        }
      }
      triggerGalleryImport();
    }
    window.triggerNativeCamera = triggerNativeCamera;

    window.onNativePhotoCaptured = function(dataUrl) {
      if (!dataUrl) return;
      const img = new Image();
      img.onload = function() {
        const w = img.width || 800;
        const h = img.height || 1100;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let isTimestamp = (cameraMode === 'timestamp');
        let tsText = null;
        if (isTimestamp && typeof burnTimestampWatermark === 'function') {
          tsText = burnTimestampWatermark(canvas);
        }
        const rawUrl = canvas.toDataURL('image/jpeg', 0.95);

        const newPage = {
          id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          title: `Page ${sessionPages.length + 1}`,
          rawUrl: rawUrl,
          croppedUrl: rawUrl,
          enhancedUrl: rawUrl,
          width: w,
          height: h,
          rotation: 0,
          filter: isTimestamp ? 'original' : 'magic',
          brightness: 0,
          isTimestamped: isTimestamp,
          timestampText: tsText,
          pins: {
            tl: { x: Math.round(w * 0.05), y: Math.round(h * 0.05) },
            tr: { x: Math.round(w * 0.95), y: Math.round(h * 0.05) },
            br: { x: Math.round(w * 0.95), y: Math.round(h * 0.95) },
            bl: { x: Math.round(w * 0.05), y: Math.round(h * 0.95) }
          }
        };
        sessionPages.push(newPage);
        selectedOrganizerIndex = sessionPages.length - 1;
        updateBatchThumbBadge();

        if (cameraMode === 'batch' || (typeof isBatchMode !== 'undefined' && isBatchMode)) {
          showToast(`Page ${sessionPages.length} captured from camera app`);
        } else {
          stopCamera();
          openCropForPage(selectedOrganizerIndex);
          showToast('Photo captured into scanner');
        }
      };
      img.src = dataUrl;
    };

    // Camera Facing Switch (Flip)
    async function switchCameraFacing() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      showToast(`Switching to ${currentFacingMode === 'user' ? 'front' : 'back'} camera...`);
      await initCamera();
    }
    window.switchCameraFacing = switchCameraFacing;

    function showCameraErrorBanner() {
      const videoEl = document.getElementById('camera-video');
      if (videoEl) videoEl.classList.add('hidden');
      const inactiveView = document.getElementById('camera-inactive-view');
      if (inactiveView) inactiveView.classList.remove('hidden');
      const banner = document.getElementById('camera-error-banner');
      if (banner) banner.classList.remove('hidden');
    }

    function openAppSettings() {
      if (window.DocErenaBridge && window.DocErenaBridge.openAppSettings) {
        try {
          window.DocErenaBridge.openAppSettings();
          return;
        } catch(e) {}
      }
      showToast('Grant Camera permission: Android Settings > Apps > DocErena > Permissions > Camera');
    }

    // Torch / Flashlight Subsystem
    async function setTorch(enable) {
      let applied = false;
      if (activeCameraStream) {
        const track = activeCameraStream.getVideoTracks()[0];
        if (track) {
          try {
            const capabilities = (typeof track.getCapabilities === 'function') ? track.getCapabilities() : {};
            if (capabilities.torch || 'torch' in capabilities) {
              await track.applyConstraints({
                advanced: [{ torch: !!enable }]
              });
              applied = true;
            } else {
              await track.applyConstraints({
                advanced: [{ torch: !!enable }]
              });
              applied = true;
            }
          } catch(e) {
            console.warn("Track applyConstraints torch warning:", e);
          }
        }
      }

      if (!applied && window.DocErenaBridge && typeof window.DocErenaBridge.setTorchMode === 'function') {
        try {
          applied = window.DocErenaBridge.setTorchMode(!!enable);
        } catch(e) {
          console.warn("DocErenaBridge.setTorchMode warning:", e);
        }
      }
      return applied;
    }
    window.setTorch = setTorch;

    function stopCamera() {
      if (typeof updateCameraTimestampPreview === 'function') updateCameraTimestampPreview(false);
      if (typeof stopQrScanningLoop === 'function') stopQrScanningLoop();
      setTorch(false);
      if (activeCameraStream) {
        try {
          activeCameraStream.getTracks().forEach(track => {
            try { track.stop(); } catch(e) {}
          });
        } catch(e) {}
        activeCameraStream = null;
      }
      ['camera-video', 'id-card-camera-feed', 'book-camera-feed'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.srcObject = null;
      });
    }

    function leaveCameraScanner() {
      stopCamera();
      if (sessionPages.length > 0) {
        navigateTo('organizer');
      } else {
        navigateTo('home');
      }
    }

    async function cycleFlash() {
      currentFlashIndex = (currentFlashIndex + 1) % flashModes.length;
      const mode = flashModes[currentFlashIndex];
      const lbl = document.getElementById('camera-flash-label');
      if (lbl) lbl.textContent = mode;

      const indicator = document.getElementById('camera-flash-indicator');
      if (indicator) {
        if (mode === 'Torch') {
          indicator.style.transform = 'translateX(10px)';
          indicator.className = 'w-2.5 h-2.5 rounded-full bg-[#10B981] transition-transform';
        } else if (mode === 'Auto') {
          indicator.style.transform = 'translateX(5px)';
          indicator.className = 'w-2.5 h-2.5 rounded-full bg-[#3B82F6] transition-transform';
        } else {
          indicator.style.transform = 'translateX(0px)';
          indicator.className = 'w-2.5 h-2.5 rounded-full bg-[#D97706] transition-transform';
        }
      }

      const isTorch = (mode === 'Torch');
      await setTorch(isTorch);
      showToast(`Flash mode: ${mode}`);
    }

    let timestampClockTimer = null;

    function updateCameraTimestampPreview(show) {
      const previewEl = document.getElementById('camera-timestamp-preview');
      const clockEl = document.getElementById('camera-timestamp-clock');
      if (timestampClockTimer) {
        clearInterval(timestampClockTimer);
        timestampClockTimer = null;
      }
      if (show) {
        if (previewEl) previewEl.classList.remove('hidden');
        const updateClock = () => {
          const now = new Date();
          const tsStr = now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
          if (clockEl) clockEl.textContent = tsStr;
        };
        updateClock();
        timestampClockTimer = setInterval(updateClock, 1000);
      } else {
        if (previewEl) previewEl.classList.add('hidden');
      }
    }
    window.updateCameraTimestampPreview = updateCameraTimestampPreview;

    function burnTimestampWatermark(canvas, customText) {
      if (!canvas || canvas.width === 0 || canvas.height === 0) return '';
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const now = new Date();
      const text = customText || `DocErena Verified • ${now.toISOString().replace('T', ' ').substring(0, 19)} UTC`;
      const bannerH = Math.max(38, Math.round(h * 0.04));
      const fontSize = Math.max(14, Math.round(bannerH * 0.48));

      ctx.save();
      // Semi-transparent dark background bar at bottom
      ctx.fillStyle = 'rgba(15, 12, 26, 0.78)';
      ctx.fillRect(0, h - bannerH, w, bannerH);

      // Accent border line at top of strip
      ctx.fillStyle = '#8B5CF6';
      ctx.fillRect(0, h - bannerH, w, Math.max(2, Math.round(bannerH * 0.05)));

      // Watermark text
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `bold ${fontSize}px monospace, sans-serif`;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 20, h - (bannerH / 2));

      // Right-aligned verification badge
      ctx.fillStyle = '#A78BFA';
      ctx.font = `bold ${Math.max(11, Math.round(fontSize * 0.8))}px sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText('ISO 32000 CERTIFIED OFFLINE', w - 20, h - (bannerH / 2));
      ctx.restore();
      return text;
    }
    window.burnTimestampWatermark = burnTimestampWatermark;

    function selectScanMode(mode) {

    // ============================================================
    // OFFLINE SCAN CODE / QR CODE SUBSYSTEM (100% AIRPLANE-READY)
    // ============================================================
    let isScanCodeDialogOpen = false;
    let qrScanInterval = null;
    let lastScannedPayload = null;
    let lastScannedTime = 0;
    let previousCameraModeBeforeCode = 'single';
    let currentDecodedPayload = '';

    function openScanCodeMode() {
      // 1. Preserve active camera draft intact (sessionPages is untouched)
      if (cameraMode && cameraMode !== 'code') {
        previousCameraModeBeforeCode = cameraMode;
      }

      // 2. Dismiss any open drawer modals
      closeCameraAllFeatures();
      if (typeof closeComingSoonModal === 'function') closeComingSoonModal();

      // 3. Navigate to camera screen if on another tab/screen
      if (currentScreen !== 'camera') {
        navigateTo('camera');

      // 4. Activate code mode
      if (typeof setCameraScanMode === 'function') {

    function closeScanCodeMode() {
      stopQrScanningLoop();

      if (qrOverlay) qrOverlay.classList.add('hidden');
      const docFrame = document.getElementById('camera-doc-frame');
      if (docFrame) docFrame.classList.remove('hidden');

      // Restore previous scan mode without losing any session draft pages
      const restoreMode = previousCameraModeBeforeCode || 'single';
      if (typeof setCameraScanMode === 'function') {
        setCameraScanMode(restoreMode);
      } else {
        selectScanMode(restoreMode);
      }
      showToast(`Returned to ${restoreMode.toUpperCase()} camera`);
    }
    window.closeScanCodeMode = closeScanCodeMode;

    function startQrScanningLoop() {
      if (qrScanInterval) {
        clearInterval(qrScanInterval);
        qrScanInterval = null;
      }

      const offscreenCanvas = document.createElement('canvas');
      const ctx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

      qrScanInterval = setInterval(() => {
        // Prevent repeated scans if modal is open, or camera mode changed
        if (isScanCodeDialogOpen || cameraMode !== 'code') return;
        const video = document.getElementById('camera-video');
        if (!video || video.classList.contains('hidden') || video.readyState < 2 || video.videoWidth === 0) return;

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const scanDim = 420;
        offscreenCanvas.width = scanDim;
        offscreenCanvas.height = scanDim;

        // Sample centered square from video feed
        const cropSize = Math.min(vw, vh) * 0.75;
        const sx = (vw - cropSize) / 2;
        const sy = (vh - cropSize) / 2;

        try {
          ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, scanDim, scanDim);
          const imgData = ctx.getImageData(0, 0, scanDim, scanDim);
          if (typeof jsQR === 'function') {
            const code = jsQR(imgData.data, scanDim, scanDim, { inversionAttempts: 'attemptBoth' });
            if (code && code.data && code.data.trim().length > 0) {
              handleDecodedCode(code.data.trim());
            }
          }
        } catch(e) {
          console.warn("QR frame decode error:", e);
        }
      }, 200);
    }
    window.startQrScanningLoop = startQrScanningLoop;

    function stopQrScanningLoop() {
      if (qrScanInterval) {
        clearInterval(qrScanInterval);
        qrScanInterval = null;
      }
    }
    window.stopQrScanningLoop = stopQrScanningLoop;

    function handleDecodedCode(rawContent) {
      if (!rawContent) return;
      const content = rawContent.trim();

      // Crucial: Prevent repeated reads of the same code from stacking dialogs
      if (isScanCodeDialogOpen) return;
      const now = Date.now();
      if (content === lastScannedPayload && (now - lastScannedTime) < 2500) {
        return; // Debounce duplicate read of identical code within 2.5s
      }

      lastScannedPayload = content;
      lastScannedTime = now;
      isScanCodeDialogOpen = true;

      // Haptic feedback & notification sound
      if (typeof playNativeHapticSound === 'function') playNativeHapticSound('success');
      if (navigator.vibrate) {
        try { navigator.vibrate(45); } catch(e) {}
      }

      showQrResultModal(content);
    }
    window.handleDecodedCode = handleDecodedCode;

    function showQrResultModal(content) {
      currentDecodedPayload = content;
      const modal = document.getElementById('modal-qr-result');

      const openBtn = document.getElementById('qr-open-link-btn');

      if (textEl) textEl.textContent = content;
      if (copyBtnText) copyBtnText.textContent = 'Copy to Clipboard';

      const isUrl = /^https?:\/\//i.test(content);
      if (badgeEl) {
        if (isUrl) {
          badgeEl.className = 'inline-flex items-center space-x-1 px-3 py-0.5 rounded-full bg-[#E0F2FE] text-[#0284C7] text-[11px] font-black tracking-wide uppercase';

        } else {
          badgeEl.className = 'inline-flex items-center space-x-1 px-3 py-0.5 rounded-full bg-[#EDE9FE] text-[#7C3AED] text-[11px] font-black tracking-wide uppercase';
          badgeEl.innerHTML = '<svg class="w-3.5 h-3.5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Plain Text</span>';
        }

    function copyDecodedQrText() {
      if (!currentDecodedPayload) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentDecodedPayload).then(() => {
          onCopySuccess();
        }).catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }

      function fallbackCopy() {
        try {
          const ta = document.createElement('textarea');
          ta.value = currentDecodedPayload;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          onCopySuccess();
        } catch(e) {
          showToast('Failed to copy to clipboard');
        }
      }

      function onCopySuccess() {
        const btnText = document.getElementById('qr-copy-btn-text');
        if (btnText) btnText.textContent = 'Copied to Clipboard!';
        showToast('Decoded text copied to clipboard');
        setTimeout(() => {
          if (btnText) btnText.textContent = 'Copy to Clipboard';
        }, 2200);
      }
    }
    window.copyDecodedQrText = copyDecodedQrText;

    function openDecodedQrUrl() {
      if (!currentDecodedPayload) return;
      const url = currentDecodedPayload.trim();
      if (!/^https?:\/\//i.test(url)) {
        showToast('Not a valid web link');
        return;

      // Check native Android bridge first
      if (window.DocErenaNative && typeof window.DocErenaNative.openExternalUrl === 'function') {
        try {
          window.DocErenaNative.openExternalUrl(url);
          showToast('Opening link in browser...');
          return;

          console.warn("DocErenaNative.openExternalUrl warning:", e);

      try {
        window.open(url, '_blank', 'noopener,noreferrer');
        showToast('Opening link...');
      } catch(e) {
        showToast('Could not open browser');
      }
    }

    function handleQrFileInputChange(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;
      const file = files[0];

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width || 600;
          canvas.height = img.height || 600;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          try {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            if (typeof jsQR === 'function') {
              const code = jsQR(imgData.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
              if (code && code.data && code.data.trim().length > 0) {
                handleDecodedCode(code.data.trim());
                return;
              }
            }
          } catch(err) {
            console.warn("Image file QR decode error:", err);
          }

          // Blurry, unreadable, or non-QR image: honest non-crashing feedback
          showToast('No readable QR code found in selected image');
        };
        img.onerror = function() {
          showToast('Unable to load image for QR decoding');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
    window.handleQrFileInputChange = handleQrFileInputChange;

    // ============================================================

    const ID_PHOTO_PRESETS = {

    function setIdPhotoPreset(presetKey) {

    function renderIdPhotoCanvas() {
      const canvas = document.getElementById('id-photo-canvas');
      if (!canvas || !currentIdPhotoImg) return;
      const ctx = canvas.getContext('2d');

      const wrapper = document.getElementById('id-photo-canvas-wrapper');
      const maxW = (wrapper ? wrapper.clientWidth : 340) || 340;
      const maxH = (wrapper ? wrapper.clientHeight : 270) || 270;

      canvas.width = maxW;
      canvas.height = maxH;

      ctx.fillStyle = '#0F172A';
      ctx.fillRect(0, 0, maxW, maxH);

      const imgAspect = currentIdPhotoImg.width / currentIdPhotoImg.height;
      let drawW, drawH;
      if (imgAspect > (maxW / maxH)) {
        drawW = maxW * 0.9 * currentIdPhotoZoom;
        drawH = drawW / imgAspect;
      } else {
        drawH = maxH * 0.9 * currentIdPhotoZoom;
        drawW = drawH * imgAspect;
      }

      const drawX = (maxW - drawW) / 2;
      const drawY = (maxH - drawH) / 2;

      ctx.drawImage(currentIdPhotoImg, drawX, drawY, drawW, drawH);
    }

    function exportIdPhoto() {
      if (!currentIdPhotoImg) {
        showToast('Please select or capture a photo first');
        return;
      }

      const preset = ID_PHOTO_PRESETS[currentIdPhotoPreset] || ID_PHOTO_PRESETS['us-passport'];

      if (!isIdSheetMode) {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = preset.pxW;
        outCanvas.height = preset.pxH;
        const outCtx = outCanvas.getContext('2d');

        const imgAspect = currentIdPhotoImg.width / currentIdPhotoImg.height;
        let cropW, cropH;
        if (imgAspect > preset.ratio) {
          cropH = currentIdPhotoImg.height;
          cropW = cropH * preset.ratio;
        } else {
          cropW = currentIdPhotoImg.width;
          cropH = cropW / preset.ratio;
        }

        cropW /= currentIdPhotoZoom;
        cropH /= currentIdPhotoZoom;
        const cropX = Math.max(0, (currentIdPhotoImg.width - cropW) / 2);
        const cropY = Math.max(0, (currentIdPhotoImg.height - cropH) / 2);

        outCtx.drawImage(currentIdPhotoImg, cropX, cropY, cropW, cropH, 0, 0, preset.pxW, preset.pxH);

        const exportedUrl = outCanvas.toDataURL('image/jpeg', 0.95);
        saveExportedToolImage(exportedUrl, `ID_Photo_${preset.name.replace(/\s+/g, '_')}`);
        showToast(`Exported ID Photo: ${preset.pxW}×${preset.pxH} px`);
        closeIdPhotoMaker();
      } else {
        const sheetCanvas = document.createElement('canvas');
        sheetCanvas.width = 1800;
        sheetCanvas.height = 1200;
        const sheetCtx = sheetCanvas.getContext('2d');

        sheetCtx.fillStyle = '#FFFFFF';
        sheetCtx.fillRect(0, 0, 1800, 1200);

        sheetCtx.fillStyle = '#64748B';
        sheetCtx.font = 'bold 24px system-ui, sans-serif';
        sheetCtx.fillText(`DocErena 4×6" Print Sheet • ${preset.name} (${preset.widthMm}×${preset.heightMm} mm)`, 60, 48);

        const singleC = document.createElement('canvas');
        singleC.width = preset.pxW;
        singleC.height = preset.pxH;
        const sCtx = singleC.getContext('2d');
        const imgAspect = currentIdPhotoImg.width / currentIdPhotoImg.height;
        let cropW = (imgAspect > preset.ratio) ? currentIdPhotoImg.height * preset.ratio : currentIdPhotoImg.width;
        let cropH = (imgAspect > preset.ratio) ? currentIdPhotoImg.height : currentIdPhotoImg.width / preset.ratio;
        cropW /= currentIdPhotoZoom;
        cropH /= currentIdPhotoZoom;
        let cropX = Math.max(0, (currentIdPhotoImg.width - cropW) / 2);
        let cropY = Math.max(0, (currentIdPhotoImg.height - cropH) / 2);
        sCtx.drawImage(currentIdPhotoImg, cropX, cropY, cropW, cropH, 0, 0, preset.pxW, preset.pxH);

        const cols = 4;
        const rows = 2;
        const cellW = 380;
        const cellH = Math.round(cellW / preset.ratio);
        const marginX = (1800 - (cols * cellW)) / (cols + 1);
        const marginY = 80 + (1120 - (rows * cellH)) / (rows + 1);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = Math.round(marginX + c * (cellW + marginX));
            const y = Math.round(marginY + r * (cellH + marginY));

            sheetCtx.drawImage(singleC, 0, 0, preset.pxW, preset.pxH, x, y, cellW, cellH);

            sheetCtx.strokeStyle = '#CBD5E1';
            sheetCtx.lineWidth = 1.5;
            sheetCtx.setLineDash([8, 6]);
            sheetCtx.strokeRect(x - 2, y - 2, cellW + 4, cellH + 4);
            sheetCtx.setLineDash([]);
          }
        }

        const exportedUrl = sheetCanvas.toDataURL('image/jpeg', 0.95);
        saveExportedToolImage(exportedUrl, `ID_Photo_Sheet_4x6_${preset.name.replace(/\s+/g, '_')}`);
        showToast('Exported 4×6" 8-Photo Printable Sheet (1800×1200 px)');
        closeIdPhotoMaker();
      }

    function applyLocalPhotoRestoration(dataUrl, intensity) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('restore-photo-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const n = data.length;

        const hist = new Uint32Array(256);
        for (let i = 0; i < n; i += 4) {
          const lum = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
          hist[lum]++;
        }

        const totalPixels = n / 4;
        const p02 = totalPixels * 0.02;
        const p98 = totalPixels * 0.98;

        let count = 0;
        let minLum = 0;
        for (let l = 0; l < 256; l++) {
          count += hist[l];
          if (count >= p02) { minLum = l; break; }
        }

        count = 0;
        let maxLum = 255;
        for (let l = 255; l >= 0; l--) {
          count += hist[l];
          if (count >= totalPixels - p98) { maxLum = l; break; }
        }

        const lumRange = Math.max(1, maxLum - minLum);
        const factor = intensity / 100;
        const chromaFactor = 1.0 + (0.35 * factor);

        for (let i = 0; i < n; i += 4) {
          const origR = data[i];
          const origG = data[i + 1];
          const origB = data[i + 2];

          let r = Math.min(255, Math.max(0, ((origR - minLum) / lumRange) * 255));
          let g = Math.min(255, Math.max(0, ((origG - minLum) / lumRange) * 255));
          let b = Math.min(255, Math.max(0, ((origB - minLum) / lumRange) * 255));

          const curLum = 0.299 * r + 0.587 * g + 0.114 * b;
          r = Math.min(255, Math.max(0, curLum + (r - curLum) * chromaFactor));
          g = Math.min(255, Math.max(0, curLum + (g - curLum) * chromaFactor));
          b = Math.min(255, Math.max(0, curLum + (b - curLum) * chromaFactor));

          data[i] = Math.round(origR * (1 - factor) + r * factor);
          data[i + 1] = Math.round(origG * (1 - factor) + g * factor);
          data[i + 2] = Math.round(origB * (1 - factor) + b * factor);
        }

        ctx.putImageData(imgData, 0, 0);
        restoreRestoredUrl = canvas.toDataURL('image/jpeg', 0.95);
        updateRestoreBadge(false);
      };
      img.src = dataUrl;
    }

    function setupSmartEraseDrawing() {
      const maskCanvas = document.getElementById('smart-erase-mask-canvas');
      if (!maskCanvas || maskCanvas._hasDrawListeners) return;
      maskCanvas._hasDrawListeners = true;

      function getPos(e) {
        const rect = maskCanvas.getBoundingClientRect();
        const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
        const scaleX = maskCanvas.width / (rect.width || 1);
        const scaleY = maskCanvas.height / (rect.height || 1);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function drawLine(p1, p2) {
        const ctx = maskCanvas.getContext('2d');
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.55)';
        ctx.fillStyle = 'rgba(239, 68, 68, 0.55)';
        ctx.lineWidth = smartEraseBrushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      const onStart = (e) => {
        e.preventDefault();
        isSmartErasePainting = true;
        smartEraseLastPt = getPos(e);
        const ctx = maskCanvas.getContext('2d');
        ctx.fillStyle = 'rgba(239, 68, 68, 0.55)';
        ctx.beginPath();
        ctx.arc(smartEraseLastPt.x, smartEraseLastPt.y, smartEraseBrushSize / 2, 0, Math.PI * 2);
        ctx.fill();
      };

      const onMove = (e) => {
        if (!isSmartErasePainting) return;
        e.preventDefault();
        const curPt = getPos(e);
        drawLine(smartEraseLastPt, curPt);
        smartEraseLastPt = curPt;
      };

      const onEnd = (e) => {
        if (!isSmartErasePainting) return;
        isSmartErasePainting = false;
        smartEraseLastPt = null;
      };

      maskCanvas.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      maskCanvas.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd, { passive: false });
    }

    function applySmartErase() {
      const baseCanvas = document.getElementById('smart-erase-base-canvas');
      const maskCanvas = document.getElementById('smart-erase-mask-canvas');
      if (!baseCanvas || !maskCanvas) return;

      const bCtx = baseCanvas.getContext('2d');
      const mCtx = maskCanvas.getContext('2d');
      const w = baseCanvas.width;
      const h = baseCanvas.height;

      const baseImgData = bCtx.getImageData(0, 0, w, h);
      const maskImgData = mCtx.getImageData(0, 0, w, h);

      let hasMask = false;
      const mData = maskImgData.data;
      for (let i = 3; i < mData.length; i += 4) {
        if (mData[i] > 20) { hasMask = true; break; }
      }
      if (!hasMask) {
        showToast('Draw over an object or mark with the brush first');
        return;
      }

      smartEraseUndoStack.push(bCtx.getImageData(0, 0, w, h));
      updateSmartEraseUndoButton();

      const bData = baseImgData.data;
      const maskArr = new Uint8Array(w * h);
      let maskedCount = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (mData[idx * 4 + 3] > 20) {
            maskArr[idx] = 1;
            maskedCount++;
          }
        }
      }

      // Collect perimeter boundary pixels (unmasked pixels adjacent to masked pixels)
      const boundarySamples = [];
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          if (maskArr[idx] === 0) {
            if (maskArr[idx - 1] === 1 || maskArr[idx + 1] === 1 ||
                maskArr[idx - w] === 1 || maskArr[idx + w] === 1) {
              const p = idx * 4;
              boundarySamples.push({ x, y, r: bData[p], g: bData[p+1], b: bData[p+2] });
            }
          }
        }
      }

      if (boundarySamples.length > 0) {
        // Subsample boundary to max 64 points for fast smooth interpolation
        const step = Math.max(1, Math.floor(boundarySamples.length / 64));
        const sampledBoundary = [];
        for (let i = 0; i < boundarySamples.length; i += step) {
          sampledBoundary.push(boundarySamples[i]);
        }

        // Initialize all masked pixels with inverse-distance weighted boundary color
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (maskArr[idx] === 1) {
              let weightSum = 0;
              let sumR = 0, sumG = 0, sumB = 0;
              for (let s = 0; s < sampledBoundary.length; s++) {
                const bp = sampledBoundary[s];
                const distSq = (x - bp.x) * (x - bp.x) + (y - bp.y) * (y - bp.y) + 1;
                const wgt = 1 / distSq;
                weightSum += wgt;
                sumR += bp.r * wgt;
                sumG += bp.g * wgt;
                sumB += bp.b * wgt;
              }
              const p = idx * 4;
              bData[p] = Math.round(sumR / weightSum);
              bData[p + 1] = Math.round(sumG / weightSum);
              bData[p + 2] = Math.round(sumB / weightSum);
            }
          }
        }

        // Local relaxation smoothing passes (6 passes)
        for (let iter = 0; iter < 6; iter++) {
          for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
              const idx = y * w + x;
              if (maskArr[idx] === 1) {
                const p = idx * 4;
                let sR = 0, sG = 0, sB = 0;
                const neighbors = [idx - 1, idx + 1, idx - w, idx + w];
                for (let k = 0; k < 4; k++) {
                  const np = neighbors[k] * 4;
                  sR += bData[np]; sG += bData[np+1]; sB += bData[np+2];
                }
                bData[p] = Math.round(sR / 4);
                bData[p + 1] = Math.round(sG / 4);
                bData[p + 2] = Math.round(sB / 4);
              }
            }
          }
        }
      }

      bCtx.putImageData(baseImgData, 0, 0);
      mCtx.clearRect(0, 0, w, h);
      showToast('Erase applied successfully');
    }
    window.applySmartErase = applySmartErase;

    function undoSmartErase() {

      const prev = smartEraseUndoStack.pop();
      const baseCanvas = document.getElementById('smart-erase-base-canvas');

    function createDefaultBlemishSample() {
      return new Promise(resolve => {
        const c = document.createElement('canvas');
        c.width = 600;
        c.height = 400;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 600, 400);

        ctx.fillStyle = '#1E1B18';

    function handleGreetingCardPhotoPicked(e) {

      reader.onload = function(evt) {
        cardPersonalPhotoUrl = evt.target.result;

    function renderGreetingCardPreview() {
      const canvas = document.getElementById('greeting-card-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      canvas.width = 700;
      canvas.height = 980;

      const recipient = (document.getElementById('card-input-recipient')?.value || 'Dear Friend,').trim();
      const message = (document.getElementById('card-input-message')?.value || 'Wishing you joy and wonderful moments!').trim();
      const sender = (document.getElementById('card-input-sender')?.value || 'Warmly, Sophia').trim();

      if (currentCardTemplate === 'birthday') {
        const grad = ctx.createLinearGradient(0, 0, 700, 980);
        grad.addColorStop(0, '#FFF1F2');
        grad.addColorStop(0.5, '#FEF3C7');
        grad.addColorStop(1, '#EDE9FE');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 700, 980);

        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 5;
        ctx.strokeRect(30, 30, 640, 920);
        ctx.strokeStyle = '#E11D48';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(40, 40, 620, 900);

        ctx.fillStyle = '#BE123C';
        ctx.font = '900 38px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('★ HAPPY BIRTHDAY ★', 350, 110);
      } else if (currentCardTemplate === 'thankyou') {
        const grad = ctx.createLinearGradient(0, 0, 700, 980);
        grad.addColorStop(0, '#FAF5FF');
        grad.addColorStop(1, '#F3E8FF');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 700, 980);

        ctx.strokeStyle = '#7C3AED';
        ctx.lineWidth = 4;
        ctx.strokeRect(32, 32, 636, 916);
        ctx.strokeStyle = '#A78BFA';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(42, 42, 616, 896);

        ctx.fillStyle = '#6D28D9';
        ctx.font = '900 36px serif';
        ctx.textAlign = 'center';
        ctx.fillText('THANK YOU SO MUCH', 350, 110);
      } else if (currentCardTemplate === 'congrats') {
        const grad = ctx.createLinearGradient(0, 0, 700, 980);
        grad.addColorStop(0, '#EDE9FE');
        grad.addColorStop(0.5, '#FEF08A');
        grad.addColorStop(1, '#F3E8FF');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 700, 980);

        ctx.strokeStyle = '#854D0E';
        ctx.lineWidth = 4;
        ctx.strokeRect(30, 30, 640, 920);

        ctx.fillStyle = '#7E22CE';
        ctx.font = '900 38px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CONGRATULATIONS!', 350, 110);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 700, 980);
        grad.addColorStop(0, '#F0FDF4');
        grad.addColorStop(1, '#FEF2F2');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 700, 980);

        ctx.strokeStyle = '#15803D';
        ctx.lineWidth = 4;
        ctx.strokeRect(32, 32, 636, 916);
        ctx.strokeStyle = '#DC2626';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(42, 42, 616, 896);

        ctx.fillStyle = '#166534';
        ctx.font = '900 36px serif';
        ctx.textAlign = 'center';
        ctx.fillText('SEASON\'S GREETINGS', 350, 110);
      }

      let textStartY = 190;
      if (cardPersonalPhotoUrl) {
        const photoImg = new Image();
        photoImg.onload = function() {
          const pW = 340, pH = 240, pX = (700 - pW) / 2, pY = 160;
          ctx.save();
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(pX - 4, pY - 4, pW + 8, pH + 8);
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 1;
          ctx.strokeRect(pX - 4, pY - 4, pW + 8, pH + 8);
          ctx.drawImage(photoImg, pX, pY, pW, pH);
          ctx.restore();
          drawCardTypography(ctx, recipient, message, sender, 450);
        };
        photoImg.src = cardPersonalPhotoUrl;
      } else {
        drawCardTypography(ctx, recipient, message, sender, textStartY);
      }
    }
    window.renderGreetingCardPreview = renderGreetingCardPreview;

    function drawCardTypography(ctx, recipient, message, sender, startY) {
      ctx.fillStyle = '#1E1B18';
      ctx.font = 'bold 26px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(recipient, 350, startY);

      ctx.fillStyle = '#334155';
      ctx.font = '500 20px system-ui, sans-serif';
      const words = message.split(' ');
      let line = '';
      let y = startY + 50;
      const maxWidth = 520;
      for (let i = 0; i < words.length; i++) {
        const testLine = line + words[i] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && i > 0) {
          ctx.fillText(line, 350, y);
          line = words[i] + ' ';
          y += 34;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 350, y);

      ctx.fillStyle = '#7C3AED';
      ctx.font = 'italic bold 24px serif';
      ctx.fillText(sender, 350, Math.max(y + 80, 840));
    }

    function captureCurrentPage() {
      // Trigger mobile camera shutter haptic sound and flash
      if (typeof playNativeHapticSound === 'function') playNativeHapticSound('shutter');
      const flashEl = document.getElementById('camera-flash-overlay');
      if (flashEl) {
        flashEl.classList.remove('hidden');
        flashEl.style.opacity = '1';
        setTimeout(() => {
          flashEl.style.opacity = '0';
          setTimeout(() => flashEl.classList.add('hidden'), 200);
        }, 50);
      }

      const videoEl = document.getElementById('camera-video');

      if (!videoEl || videoEl.classList.contains('hidden') || !activeCameraStream || videoEl.videoWidth === 0) {
        // Camera is denied or unavailable: show honest error banner, never silently substitute demo image
        showCameraErrorBanner();
        showToast('Camera unavailable. Grant permission or use Import below.');
        return;
      }

      const w = videoEl.videoWidth;
      const h = videoEl.videoHeight;
      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = w;
      captureCanvas.height = h;
      const ctx = captureCanvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, w, h);

      const isTimestamp = (cameraMode === 'timestamp');
      let tsText = null;
      if (isTimestamp && typeof burnTimestampWatermark === 'function') {
        tsText = burnTimestampWatermark(captureCanvas);
      }

      const rawDataUrl = captureCanvas.toDataURL('image/jpeg', 0.95);

      const newPage = {
        id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        title: `Page ${sessionPages.length + 1}`,
        rawUrl: rawDataUrl,
        croppedUrl: rawDataUrl,
        enhancedUrl: rawDataUrl,
        width: w,
        height: h,
        rotation: 0,
        filter: isTimestamp ? 'original' : (cameraMode === 'slides' ? 'slides' : (cameraMode === 'whiteboard' ? 'whiteboard' : 'magic')),
        brightness: 0,
        isTimestamped: isTimestamp,
        timestampText: tsText,
        pins: {
          tl: { x: 0.05, y: 0.05 },
          tr: { x: 0.95, y: 0.05 },
          br: { x: 0.95, y: 0.95 },
          bl: { x: 0.05, y: 0.95 }
        }
      };

      sessionPages.push(newPage);
      selectedOrganizerIndex = sessionPages.length - 1;

      // Update badge counter and review button thumbnail
      updateBatchThumbBadge();

      // If in batch mode, keep camera live for continuous multi-page accumulation
      if (cameraMode === 'batch' || (typeof isBatchMode !== 'undefined' && isBatchMode)) {
        showToast(`Page ${sessionPages.length} added to batch`);
        return;
      }

      // Stop camera before navigating to crop (Single mode)
      stopCamera();

      // Open Crop Screen
      openCropForPage(selectedOrganizerIndex);
    }

    function addRawImageToBatch(dataUrl, title, callback) {
      const img = new Image();
      img.onload = function() {
        try {
          const w = img.naturalWidth || img.width || 800;
          const h = img.naturalHeight || img.height || 1100;
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let rawUrl = '';
          try {
            rawUrl = canvas.toDataURL('image/jpeg', 0.92);
          } catch (e) {
            console.warn("toDataURL fallback to dataUrl:", e);
          }
          if (!rawUrl && typeof dataUrl === 'string' && dataUrl.startsWith('data:')) {
            rawUrl = dataUrl;
          }

          const newPage = {
            id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            title: title || `Page ${sessionPages.length + 1}`,
            rawUrl: rawUrl,
            croppedUrl: rawUrl,
            enhancedUrl: rawUrl,
            dataUrl: rawUrl,
            width: w,
            height: h,
            rotation: 0,
            filter: 'magic',
            brightness: 0,
            pins: {
              tl: { x: Math.round(w * 0.05), y: Math.round(h * 0.05) },
              tr: { x: Math.round(w * 0.95), y: Math.round(h * 0.05) },
              br: { x: Math.round(w * 0.95), y: Math.round(h * 0.95) },
              bl: { x: Math.round(w * 0.05), y: Math.round(h * 0.95) }
            }
          };

          sessionPages.push(newPage);
          updateBatchThumbBadge();
          if (typeof callback === 'function') callback(newPage);
        } catch (err) {
          console.error("addRawImageToBatch exception:", err);
          const rawUrl = (typeof dataUrl === 'string' && dataUrl.startsWith('data:')) ? dataUrl : '';
          const newPage = {
            id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            title: title || `Page ${sessionPages.length + 1}`,
            rawUrl: rawUrl,
            croppedUrl: rawUrl,
            enhancedUrl: rawUrl,
            dataUrl: rawUrl,
            width: 800,
            height: 1100,
            rotation: 0,
            filter: 'magic',
            brightness: 0
          };
          sessionPages.push(newPage);
          updateBatchThumbBadge();
          if (typeof callback === 'function') callback(newPage);
        }
      };
      img.onerror = function(err) {
        console.error("addRawImageToBatch image loading error:", err);
        const rawUrl = (typeof dataUrl === 'string' && dataUrl.startsWith('data:')) ? dataUrl : '';
        const newPage = {
          id: 'page_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          title: title || `Page ${sessionPages.length + 1}`,
          rawUrl: rawUrl,
          croppedUrl: rawUrl,
          enhancedUrl: rawUrl,
          dataUrl: rawUrl,
          width: 800,
          height: 1100,
          rotation: 0,
          filter: 'magic',
          brightness: 0
        };
        sessionPages.push(newPage);
        updateBatchThumbBadge();
        if (typeof callback === 'function') callback(newPage);
      };
      img.src = dataUrl;
    }

    window.importRawImageIntoBatch = function(dataUrl, title) {

          selectedOrganizerIndex = sessionPages.length - 1;
          resolve(page);
        });
      });

    function importSampleContractAndInvoice() {
      sessionPages = [];
      showToast('Importing authentic Contract & Invoice...');
      addRawImageToBatch(SAMPLE_CONTRACT_PAGE1_DATAURL, 'Contract Page 1', (p1) => {
        addRawImageToBatch(SAMPLE_INVOICE_PAGE2_DATAURL, 'Invoice Page 2', (p2) => {
          stopCamera();
          updateBatchThumbBadge();
          selectedOrganizerIndex = 0;
          navigateTo('organizer');
          renderOrganizerGrid();
          showToast('Imported 2 authentic document pages');
          console.log("SAMPLE_PAGES_IMPORTED: p1=" + p1.width + "x" + p1.height + " p2=" + p2.width + "x" + p2.height);
        });
      });
    }
    window.importSampleContractAndInvoice = importSampleContractAndInvoice;
